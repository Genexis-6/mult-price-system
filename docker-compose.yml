services:
  postgres:
    container_name: recommender_db
    image: postgres:16.3
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mult-price-network

  redis:
    container_name: redis_broker
    image: redis/redis-stack:7.2.0-v8
    restart: always
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      - REDIS_ARGS=--appendonly yes --protected-mode no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mult-price-network

  # FastAPI Application
  fastapi:
    container_name: mult-price-fastapi
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      # Override localhost with container names
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_BROKER_URL=redis://redis:6379/0
      - REDIS_BACKEND_URL=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PHOS=0.0.0.0
      - PORT=8000
    volumes:
      - ./server:/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: fastapi run app/main.py --host 0.0.0.0 --port 8000 --reload
    networks:
      - mult-price-network

  # Taskiq Worker (handles background tasks)
  taskiq-worker:
    container_name: mult-price-taskiq-worker
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./.env
    environment:
      # Override localhost with container names
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_BROKER_URL=redis://redis:6379/0
      - REDIS_BACKEND_URL=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./server:/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: taskiq worker worker.main:broker --workers 4 --log-level INFO
    networks:
      - mult-price-network

  # Taskiq Scheduler (for scheduled/cron tasks like daily price checks)
  taskiq-scheduler:
    container_name: mult-price-taskiq-scheduler
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./.env
    environment:
      # Override localhost with container names
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_BROKER_URL=redis://redis:6379/0
      - REDIS_BACKEND_URL=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./server:/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: taskiq scheduler worker.main:broker --log-level INFO
    networks:
      - mult-price-network

networks:
  mult-price-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: