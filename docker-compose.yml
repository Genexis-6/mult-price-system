
services:
  postgres:
  
    container_name: recommender_db
    image: postgres:16.3
    restart: always
    ports:
      - "5432:5432"
    
    env_file:
      - ./.env
    
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    
    volumes:
      - postgres_data:/var/lib/posgresql/data

  redis:
    container_name: redis_broker
    image: redis/redis-stack:7.2.0-v8 
    restart: always
    ports:
      - "6379:6379"
      - "8001:8001"  
    environment:
      - REDIS_ARGS=--appendonly yes --protected-mode no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    
volumes:
  postgres_data:
  redis_data:

