services:
  postgres:
    container_name: recommender_db
    image: postgres:16.3
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mult-price-network

  redis:
    container_name: redis_broker
    image: redis/redis-stack:7.2.0-v8
    restart: always
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      - REDIS_ARGS=--appendonly yes --protected-mode no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mult-price-network

  base-setup:
    build:
      context: ./server
      dockerfile: Dockerfile.base
    image: mult-price-base:latest
    volumes:
      - venv_cache:/opt/venv
      - model_cache:/tmp/model_cache  
    networks:
      - mult-price-network

  fastapi:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mult-price-fastapi
    restart: always
    ports:
      - "8000:8000" 
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_BROKER_URL=redis://redis:6379/0
      - REDIS_BACKEND_URL=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./server:/app
      - venv_cache:/opt/venv
      - ./logs:/app/logs
      - model_cache:/tmp/model_cache 
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      base-setup:
        condition: service_completed_successfully
    command: fastapi run app/main.py --host 0.0.0.0 --port 8000 --reload
    networks:
      - mult-price-network

  taskiq-worker:
    build:
      context: ./server
      dockerfile: Dockerfile.worker
    container_name: mult-price-taskiq-worker
    restart: always
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_BROKER_URL=redis://redis:6379/0
      - REDIS_BACKEND_URL=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
    volumes:
      - ./server:/app
      - venv_cache:/opt/venv
      - ./logs:/app/logs
      - model_cache:/tmp/model_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      base-setup:
        condition: service_completed_successfully
    command: taskiq worker worker.main:broker --workers 4 --log-level INFO
    networks:
      - mult-price-network

networks:
  mult-price-network:
    driver: bridge

volumes:
  venv_cache:
    name: mult_price_venv_cache
  model_cache:
    name: mult_price_model_cache
  postgres_data:
    name: mult_price_postgres_data
  redis_data:
    name: mult_price_redis_data