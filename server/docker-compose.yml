
services:
  postgres:
  
    container_name: recommender_db
    image: postgres:16.3
    restart: always
    ports:
      - "5432:5432"
    
    env_file:
      - ./.env
    
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    
    volumes:
      - postgres_data:/var/lib/posgresql/data

    
volumes:
  postgres_data:

